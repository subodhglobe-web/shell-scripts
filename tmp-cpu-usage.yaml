#!/bin/bash

# Write a script automate the cleanup of temporary files older than 10 days.
# Write a script to monitor CPU usage and alert if it exceeds a certain threshold.


threshold=85

sudo find /var/log/ -type f -mtime -10 -exec cp {} /home/ishanga/scripts/logs \;



top -b -n 1 | awk -v threshold="$threshold" '
    NR==3 {
        if (threshold < $2 || threshold < $4) {
            print "CPU_Usage_reached_above_%:-", threshold
        }
    }
' | column -t

